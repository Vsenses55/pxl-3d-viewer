<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PXL 3D Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2b1420;
    --paper: #17111a;
    --cream: #fff6ee;
    --coral: #fa4f68;
    --peach: #ffcda0;
  }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--paper);
    font-family: 'Baloo 2', system-ui, -apple-system, sans-serif;
  }
  canvas { display: block; }

  #loading {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px;
    background: linear-gradient(180deg, var(--coral), var(--peach));
    z-index: 10;
    transition: opacity 0.5s ease;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
  #loading .mark {
    display: none;
    color: var(--cream);
    font-weight: 700; font-size: 22px; letter-spacing: 0.18em; text-transform: uppercase;
  }
  #loading .mark.show-error { display: block; }
  #loading .dots { display: flex; gap: 6px; }
  #loading .dots span {
    width: 8px; height: 8px; border-radius: 50%; background: var(--cream);
    animation: bounce 1.1s infinite ease-in-out;
  }
  #loading .dots span:nth-child(2) { animation-delay: 0.15s; }
  #loading .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.6; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  #loading-progress {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 5px;
    overflow: hidden;
    background: #623673;
  }
  #loading-progress-fill {
    position: absolute; inset: 0;
    width: 0%;
    /* Sized to the viewport (the track's true full width), not to this
       element's own shrinking box, so the same continuous purple-to-magenta
       gradient is simply revealed further as it grows — the leading edge is
       always the same color as the track underneath, so there's never a
       hard seam between "filled" and "not yet filled". */
    background-image: linear-gradient(90deg, #623673, #ff5de6);
    background-size: 100vw 100%;
    background-position: left center;
    background-repeat: no-repeat;
    box-shadow: 0 0 10px 1px rgba(255, 93, 230, 0.5);
    transition: width 0.25s ease-out;
  }

  #drag-hint {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(0);
    width: 88px; height: 88px;
    opacity: 1;
    pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s ease;
    z-index: 5;
  }
  #drag-hint img { width: 100%; height: 100%; display: block; }
  @media (max-width: 600px) {
    #drag-hint { width: 76px; height: 76px; bottom: 20px; }
  }
  @media (max-width: 380px) {
    #drag-hint { width: 68px; height: 68px; bottom: 16px; }
  }
  /* Dark theme: the loading screen matches the dark scene, so a visitor who
     chose dark last time never sees a coral flash before the model appears. */
  :root[data-theme="dark"] #loading { background: linear-gradient(180deg, #1d1b23, #0f0e13); }

  /* Light/dark theme toggle (top-right). Same purple as the drag-hint icon. */
  #theme-toggle {
    position: fixed; top: 20px; right: 20px;
    width: 48px; height: 48px; padding: 0;
    display: grid; place-items: center;
    border: 0; border-radius: 50%;
    background: #623673;
    color: #fff6ee;
    box-shadow: 0 6px 18px rgba(43, 20, 32, 0.28);
    cursor: pointer;
    z-index: 6;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.3s ease;
  }
  #theme-toggle:hover { background: #7a4592; transform: scale(1.06); }
  #theme-toggle:active { transform: scale(0.96); }
  #theme-toggle:focus-visible { outline: 2px solid #ff5de6; outline-offset: 3px; }
  :root[data-theme="dark"] #theme-toggle { box-shadow: 0 6px 22px rgba(255, 93, 230, 0.25); }
  #theme-toggle svg {
    grid-area: 1 / 1;
    width: 22px; height: 22px;
    fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round;
    transition: opacity 0.3s ease, transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  #theme-toggle .icon-moon path, #theme-toggle .icon-sun circle { fill: currentColor; stroke: none; }
  /* Shows the theme you'd switch TO: a moon in light mode, a sun in dark. */
  :root:not([data-theme="dark"]) #theme-toggle .icon-sun,
  :root[data-theme="dark"] #theme-toggle .icon-moon { opacity: 0; transform: rotate(-90deg) scale(0.5); }
  @media (max-width: 600px) {
    #theme-toggle { top: 14px; right: 14px; width: 42px; height: 42px; }
    #theme-toggle svg { width: 20px; height: 20px; }
  }

  /* Weather controls: a pill of icon buttons (rain, snow) to the left of the theme
     toggle, same purple and same height. The active effect gets a cream
     fill; tapping it again turns it off. */
  #weather-controls {
    position: fixed; top: 20px; right: 80px;
    display: flex; gap: 2px; padding: 4px;
    border-radius: 999px;
    background: #623673;
    box-shadow: 0 6px 18px rgba(43, 20, 32, 0.28);
    z-index: 6;
    transition: box-shadow 0.3s ease;
  }
  :root[data-theme="dark"] #weather-controls { box-shadow: 0 6px 22px rgba(255, 93, 230, 0.25); }
  .weather-btn {
    width: 40px; height: 40px; padding: 0;
    display: grid; place-items: center;
    border: 0; border-radius: 50%;
    background: transparent;
    color: rgba(255, 246, 238, 0.75);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
  }
  .weather-btn:hover { background: rgba(255, 246, 238, 0.14); color: #fff6ee; }
  .weather-btn:active { transform: scale(0.94); }
  .weather-btn:focus-visible { outline: 2px solid #ff5de6; outline-offset: 2px; }
  .weather-btn[aria-pressed="true"] { background: #fff6ee; color: #623673; }
  .weather-btn svg {
    width: 20px; height: 20px;
    fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  @media (max-width: 600px) {
    #weather-controls { top: 14px; right: 64px; padding: 3px; }
    .weather-btn { width: 36px; height: 36px; }
    .weather-btn svg { width: 18px; height: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .weather-btn, #weather-controls { transition: none; }
    #theme-toggle, #theme-toggle svg { transition: none; }
    #loading .dots span { animation: none; }
    #loading-progress-fill { transition: none; }
    #drag-hint { transition: opacity 0.2s ease; }
  }
</style>
<script>
  // Resolve the theme before first paint so the loading screen already
  // matches it. Priority: the visitor's own saved choice, then ?theme=dark
  // or ?theme=light in the URL (lets an embedding page pick the default),
  // then light.
  (function () {
    var theme = 'light';
    try {
      var q = new URLSearchParams(location.search).get('theme');
      if (q === 'dark' || q === 'light') theme = q;
      var saved = localStorage.getItem('pxl-viewer-theme');
      if (saved === 'dark' || saved === 'light') theme = saved;
    } catch (e) {}
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
</head>
<body>

<div id="loading">
  <div class="mark">PXL</div>
  <div class="dots"><span></span><span></span><span></span></div>
  <div id="loading-progress"><div id="loading-progress-fill"></div></div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';

// Fresnel rim-light tuning (edge glow added on top of the base sheen).
// A three.js Layer reserved for flat ground-level helper planes (reflector,
// blob shadow, shadow catcher) that should stay out of the ambient-occlusion
// pass's own camera further below, while remaining visible to the main one.
const AO_EXCLUDED_LAYER = 1;

// Gloss tuning: a near-mirror clearcoat over every surface, like lacquered
// toy plastic, so the studio environment shows up as crisp highlights.
const GLOSS = {
  clearcoat: 1.0,
  clearcoatRoughness: 0.04,
  maxRoughness: 0.32,  // base-layer roughness cap (was 0.55)
};

// Glass tuning: the white parts of the letterforms (and the clouds) become
// frosted, tinted acrylic — light passes through and picks up the colors
// behind it. Matched by material name from the GLB.
const GLASS_MATERIALS = new Set(['SVGMat.048', 'SVGMat.057', 'SVGMat.052', 'Bottom Inset']);
const GLASS = {
  transmission: 0.75,  // how see-through: 0 = solid, 1 = clear glass
  roughness: 0.22,     // frost amount: 0 = clear glass, 0.4 = sandblasted
  thickness: 0.06,     // relative to model size; drives refraction depth
  ior: 1.49,           // acrylic
  attenuationColor: 0xffffff, // tint picked up inside the material (white = none)
  attenuationDistance: 1.0,
  mobileOpacity: 0.78, // phones get cheap alpha see-through instead of real transmission
};

// Meshes kept plain matte white, outside the gloss/glass treatment (the
// "..." dots on the chat bubble read best as flat white). Names are the
// GLTFLoader-sanitized form ("Curve.013" -> "Curve013").
const PLAIN_WHITE_MESHES = new Set(['Curve013']);

const STUDIO_STRIP_INTENSITY = 6; // brightness of the reflection softboxes

const RIM_COLOR = 0xff5de6;
const RIM_POWER = 2.5;
const RIM_INTENSITY = 0.5;

// Idle floating animation: small decorative props get a gentle independent
// bob + rotation wobble so the resting "PXL" hero isn't perfectly static
// before hover. Groups keep visually-paired pieces (a play icon + its
// button backdrop) moving together instead of drifting apart.
// Note: GLTFLoader sanitizes node names on import — spaces become
// underscores and dots are stripped (e.g. "Golden Cylinder" -> "Golden_Cylinder",
// "Play.001" -> "Play001") — these names match the sanitized form.
const FLOATERS = [
  { names: ['Pyramid'], ampY: 0.022, ampRot: 0.06, speed: 0.7, phase: 0.0 },
  { names: ['Golden_Cylinder'], ampY: 0.016, ampRot: 0.05, speed: 0.9, phase: 1.1 },
  { names: ['Blue_Ball'], ampY: 0.026, ampRot: 0.08, speed: 0.6, phase: 2.3 },
  { names: ['Circle_Half'], ampY: 0.018, ampRot: 0.05, speed: 0.8, phase: 3.4 },
  { names: ['Clouds_Left'], ampY: 0.02, ampRot: 0.03, speed: 0.5, phase: 0.6 },
  { names: ['Clouds_Right'], ampY: 0.02, ampRot: 0.03, speed: 0.55, phase: 2.0 },
  { names: ['Blue_Cube'], ampY: 0.02, ampRot: 0.06, speed: 0.75, phase: 4.1 },
  { names: ['Bubble'], ampY: 0.022, ampRot: 0.07, speed: 0.65, phase: 5.0 },
  // Play/Button icon trio intentionally left out of the float list — Orlando
  // asked to keep those static.
];
const floaters = [];
const clock = new THREE.Clock();

// This page is often embedded in an iframe inside a popup/modal (e.g. a
// Webflow popup) that starts out hidden and is only shown on demand. While
// an ancestor element is display:none, the iframe's own rendered viewport
// collapses to 0x0 — so if our script runs its initial sizing while that's
// still true, window.innerWidth/innerHeight are 0 and every size derived
// from them (renderer, camera aspect, post-processing render targets) ends
// up broken, which reads as a solid black canvas. Fall back to a sane
// default here so nothing is ever constructed at 0x0; syncSize() below
// corrects it to the real size as soon as one is available.
const initW = window.innerWidth || 1280;
const initH = window.innerHeight || 720;

// Phones/tablets have far less GPU memory and bandwidth than the
// desktop this was built against. Without this, the full pipeline below
// (antialiasing, 2x pixel density, a 2048px soft shadow map, a full-res
// ambient-occlusion pass) can push total GPU memory high enough that
// mobile Safari kills the tab outright ("A problem repeatedly occurred").
// Detected once at load via a coarse pointer (touch) or small viewport —
// trims resolution/quality on those devices without changing anything
// visually on desktop.
const isMobile = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches)
  || Math.min(initW, initH) <= 820
  || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

const renderer = new THREE.WebGLRenderer({ antialias: !isMobile });
// Pixel density is capped at 2x everywhere. Phones used to be capped at 1x,
// but that was before the page had a viewport meta tag: phones were laying it
// out ~980px wide and shrinking it (which is also why the drag hint looked
// tiny). With the tag, 2x on a phone is still fewer pixels than before
// (iPhone: 1.3 vs 2.1 megapixels), so it stays inside the mobile memory budget.
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(initW, initH);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// A canvas that sits hidden inside a popup's iframe for a while can have its
// WebGL context reclaimed by the browser/GPU driver — with no handling for
// that, the page would be left showing a permanently black canvas with no
// way to recover. preventDefault() on 'webglcontextlost' is what allows the
// browser to actually restore the context afterward (without it, browsers
// generally leave it lost for good); syncSize() on restore makes sure sizing
// is correct again once the new context is live.
renderer.domElement.addEventListener('webglcontextlost', (event) => {
  event.preventDefault();
  console.warn('[PXL viewer] WebGL context lost — waiting for the browser to restore it.');
}, false);
renderer.domElement.addEventListener('webglcontextrestored', () => {
  console.warn('[PXL viewer] WebGL context restored.');
  syncSize();
}, false);

const scene = new THREE.Scene();

// Backdrop: a vertical gradient painted into a tiny canvas. It's repainted
// in place (not recreated) when the theme changes, so the switch can
// crossfade smoothly. The gradient colors live in THEMES below.
const bgCanvas = document.createElement('canvas');
bgCanvas.width = 2; bgCanvas.height = 256;
const bgCtx = bgCanvas.getContext('2d');
const bgTexture = new THREE.CanvasTexture(bgCanvas);
bgTexture.colorSpace = THREE.SRGBColorSpace;
function paintBackground(stops) {
  const grad = bgCtx.createLinearGradient(0, 0, 0, 256);
  stops.forEach(([pos, color]) => grad.addColorStop(pos, color));
  bgCtx.fillStyle = grad;
  bgCtx.fillRect(0, 0, 2, 256);
  bgTexture.needsUpdate = true;
}
scene.background = bgTexture;

const pmrem = new THREE.PMREMGenerator(renderer);
// Studio environment for reflections: three.js's RoomEnvironment plus a few
// long, very bright softbox strips. The strips are what the glossy clearcoat
// mirrors as crisp streak highlights on curved edges (the "lacquered toy"
// look); the room alone only gives soft, blurry reflections.
const studioEnv = new RoomEnvironment();
{
  const stripMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(1, 1, 1).multiplyScalar(STUDIO_STRIP_INTENSITY), side: THREE.DoubleSide });
  const addStrip = (w, h, x, y, z, ry, rx = 0) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), stripMat);
    m.position.set(x, y, z); m.rotation.set(rx, ry, 0);
    studioEnv.add(m);
  };
  addStrip(0.5, 9, -5.5, 3, 2.5, Math.PI / 2.6);   // tall strip, front-left
  addStrip(0.5, 9, 5.5, 3, 2.5, -Math.PI / 2.6);   // tall strip, front-right
  addStrip(10, 0.45, 0, 9.5, 1.5, 0, Math.PI / 2); // long overhead bar
  addStrip(0.35, 6, 0, 4, -6.5, 0);                // thin back strip (catches rims)
}
scene.environment = pmrem.fromScene(studioEnv, 0.02).texture;

// near/far kept as tight as the scene allows (camera never gets closer than
// 1.5 or farther than 10 — see controls.min/maxDistance below): a near=0.01,
// far=100 range (1:10000) starves the depth buffer of precision, which
// GTAOPass's screen-space position reconstruction is very sensitive to —
// with that wide a range it was producing garbage occlusion values across
// most of the frame (visible as a large solid-black rectangle).
const camera = new THREE.PerspectiveCamera(35, initW / initH, 0.05, 30);
camera.position.set(0, 0.6, 4.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = false;
controls.autoRotateSpeed = 1.0;
controls.minDistance = 1.5;
controls.maxDistance = 10;
controls.target.set(0, 0.25, 0);
controls.addEventListener('start', () => { controls.autoRotate = false; });

let isHovering = false;
renderer.domElement.addEventListener('mouseenter', () => {
  isHovering = true;
  controls.autoRotate = true;
});
renderer.domElement.addEventListener('mouseleave', () => {
  isHovering = false;
  controls.autoRotate = false;
});

// Vertical drag range gets locked in once the model loads and frames the
// camera (see below) — keeps the view close to the product-shot framing
// and stops the camera from dipping under the model to see its underside.

const hemi = new THREE.HemisphereLight(0xfff2e6, 0xffb27a, 0.6);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff0e0, 2.2);
key.position.set(2.4, 2.6, 2.6);
key.castShadow = true;
key.shadow.mapSize.set(isMobile ? 1024 : 2048, isMobile ? 1024 : 2048);
key.shadow.radius = isMobile ? 40 : 85;
key.shadow.blurSamples = isMobile ? 12 : 40;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 12;
key.shadow.camera.left = -4;
key.shadow.camera.right = 4;
key.shadow.camera.top = 4;
key.shadow.camera.bottom = -4;
key.shadow.bias = -0.0015;
scene.add(key);

const fill = new THREE.DirectionalLight(0xfff0e0, 0.8);
fill.position.set(-2.4, 1.6, 1.6);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffe8f0, 0.9);
rim.position.set(0, 2.0, -2.4);
scene.add(rim);

const loadingEl = document.getElementById('loading');
const progressFillEl = document.getElementById('loading-progress-fill');

// Loading progress: eases up toward ~90% on its own (so there's always visible
// forward motion even when we have no real byte-level progress to report),
// then real progress (when available) can push it further. The model itself
// often loads in well under a second, so a MIN_LOADER_MS floor keeps the
// loader on screen long enough to actually see it climb, rather than
// flashing past in a blink — it always finishes with a full, solid fill the
// moment the model is ready and that minimum has elapsed.
const loadStartTime = performance.now();
const MIN_LOADER_MS = 1800;
let progressPct = 0;
let fakeProgressRAF = null;
function setProgress(pct) {
  progressPct = Math.max(progressPct, Math.min(pct, 100));
  progressFillEl.style.width = progressPct + '%';
}
function tickFakeProgress() {
  const target = 90;
  setProgress(progressPct + (target - progressPct) * 0.015);
  if (progressPct < target - 0.5) {
    fakeProgressRAF = requestAnimationFrame(tickFakeProgress);
  }
}
tickFakeProgress();
function stopProgress() {
  if (fakeProgressRAF) cancelAnimationFrame(fakeProgressRAF);
}
function finishProgress() {
  stopProgress();
  progressPct = 100;
  progressFillEl.style.width = '100%';
}
function whenLoaderMinTimeElapsed(fn) {
  const remaining = Math.max(0, MIN_LOADER_MS - (performance.now() - loadStartTime));
  setTimeout(fn, remaining);
}

// --- Post-processing: ambient occlusion, then subtle bloom for glossy highlights ---
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

// Soft GTAO contact-darkening where the little decorative shapes cluster
// and overlap the letters. screenSpaceRadius keeps the effect consistent
// regardless of the model's world-unit scale. Kept subtle (low
// blendIntensity, gentle distanceExponent) so it reads as added depth
// rather than a visible dark halo — no palette/color change, purely tonal.
// GTAOPass gets its own camera (kept in sync with the real one every frame)
// so it can exclude AO_EXCLUDED_LAYER — see where groundReflector/blob/ground
// are added to the scene for why that layer has to stay out of the AO pass.
// The main `camera` sees everything (default layer 0, plus layer 1 enabled
// explicitly), so nothing changes for the actual color pass.
camera.layers.enable(AO_EXCLUDED_LAYER);
const aoCamera = camera.clone();
aoCamera.layers.disableAll();
aoCamera.layers.enable(0);

const gtaoPass = new GTAOPass(scene, aoCamera, initW, initH, undefined, {
  radius: 0.15,
  screenSpaceRadius: true,
  distanceExponent: 1.5,
  thickness: 1,
  scale: 1,
  samples: isMobile ? 8 : 16,
  distanceFallOff: 1,
});
gtaoPass.output = GTAOPass.OUTPUT.Default;
gtaoPass.blendIntensity = 0.45;

// GTAOPass's internal normal/depth G-buffer pass renders through a temporary
// scene.overrideMaterial, but that override only swaps each OBJECT's
// material — three.js draws scene.background independently of it. Our
// background is a painted gradient texture, so it was being drawn into that
// G-buffer pass too, poisoning the depth/normal data over the rectangle the
// background quad happens to cover and producing near-total (and completely
// spurious) "occlusion" there. Strip the background for just that one
// internal render and put it back immediately after, same idea as the
// Reflector patch above.
const gtaoRenderOverride = gtaoPass.renderOverride.bind(gtaoPass);
gtaoPass.renderOverride = function (rendererArg, overrideMaterial, renderTarget, clearColor, clearAlpha) {
  const prevBackground = scene.background;
  scene.background = null;
  gtaoRenderOverride(rendererArg, overrideMaterial, renderTarget, clearColor, clearAlpha);
  scene.background = prevBackground;
};

composer.addPass(gtaoPass);

const bloomPass = new UnrealBloomPass(new THREE.Vector2(initW, initH), 0.12, 0.4, 0.9);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

// --- Light / dark themes ---------------------------------------------------
// Every value that differs between the two looks lives here. Switching
// crossfades all of them together (applyThemeMix blends 0 = light .. 1 = dark).
// The light values are exactly the original look. Nothing here adds or
// removes lights or changes material types, so switching never forces a
// shader recompile (which would hitch).
const THEMES = {
  light: {
    bg: ['#fa4f68', '#fd9487', '#ffcda0'], // top, 55%, bottom (middle stop sits on the original 2-color line)
    hemiSky: 0xfff2e6, hemiGround: 0xffb27a, hemi: 0.6,
    key: 2.2,
    fillColor: 0xfff0e0, fill: 0.8,
    rimColor: 0xffe8f0, rim: 0.9,
    envMap: 0.6,
    bloomStrength: 0.12, bloomRadius: 0.4, bloomThreshold: 0.9,
    reflIntensity: 0.18, reflTint: 0.5, reflScale: 1.0, reflBlur: 0,
    blobTint: 1.0,
    contactColor: 0x4a2436, contactOpacity: 0.09,
    // white glass parts: see-through amount, frost, and a faint inner glow
    glassTransmission: 0.75, glassFrost: 0.22, glassGlow: 0, glassMobileOpacity: 0.78,
    // weather look
    rainColor: 0xffffff, rainOpacity: 0.3, rippleOpacity: 0.4,
    snowColor: 0xffffff, snowOpacity: 0.95,
  },
  dark: {
    bg: ['#1d1b23', '#2c2934', '#0f0e13'], // charcoal with a lighter horizon band
    hemiSky: 0xcfc8ff, hemiGround: 0x2a1830, hemi: 0.3,
    key: 1.8,
    fillColor: 0xb9c3ff, fill: 0.35,
    rimColor: 0xff7ad9, rim: 1.7, // pink backlight on the edges
    envMap: 0.4,
    bloomStrength: 0.35, bloomRadius: 0.5, bloomThreshold: 0.88,
    reflIntensity: 0.12, reflTint: 0.5, reflScale: 1.6, reflBlur: 0.006, // a faint, soft sheen on the floor, barely noticeable
    blobTint: 0.05, // the plum blob would read as a lighter smudge on charcoal; darken it
    contactColor: 0x000000, contactOpacity: 0.32,
    // Against charcoal, clear glass reads grey. Less see-through, more frost and
    // a soft white inner glow keep it reading as milky white acrylic.
    glassTransmission: 0.4, glassFrost: 0.32, glassGlow: 0.12, glassMobileOpacity: 0.92,
    // weather look
    rainColor: 0xb4bccf, rainOpacity: 0.24, rippleOpacity: 0.3,
    snowColor: 0xffffff, snowOpacity: 0.9,
  },
};

// Filled in once the model has loaded (they don't exist before that).
const physicalMats = [];
const glassMats = [];
const themed = { reflector: null, reflectorMat: null, blobMat: null, groundMat: null };

const _cA = new THREE.Color(), _cB = new THREE.Color();
function lerpColor(a, b, t, target) { return target.copy(_cA.setHex(a)).lerp(_cB.setHex(b), t); }
function lerpCss(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = (shift) => Math.round(((pa >> shift) & 255) * (1 - t) + ((pb >> shift) & 255) * t);
  return `rgb(${ch(16)}, ${ch(8)}, ${ch(0)})`;
}

let themeMix = 0; // 0 = light, 1 = dark
function applyThemeMix(t) {
  themeMix = t;
  const L = THEMES.light, D = THEMES.dark;
  const n = (a, b) => a + (b - a) * t;
  paintBackground([[0, lerpCss(L.bg[0], D.bg[0], t)], [0.55, lerpCss(L.bg[1], D.bg[1], t)], [1, lerpCss(L.bg[2], D.bg[2], t)]]);
  lerpColor(L.hemiSky, D.hemiSky, t, hemi.color);
  lerpColor(L.hemiGround, D.hemiGround, t, hemi.groundColor);
  hemi.intensity = n(L.hemi, D.hemi);
  key.intensity = n(L.key, D.key);
  lerpColor(L.fillColor, D.fillColor, t, fill.color);
  fill.intensity = n(L.fill, D.fill);
  lerpColor(L.rimColor, D.rimColor, t, rim.color);
  rim.intensity = n(L.rim, D.rim);
  for (let i = 0; i < physicalMats.length; i++) physicalMats[i].envMapIntensity = n(L.envMap, D.envMap);
  for (let i = 0; i < glassMats.length; i++) {
    const g = glassMats[i];
    g.roughness = n(L.glassFrost, D.glassFrost);
    g.emissiveIntensity = n(L.glassGlow, D.glassGlow);
    // transmission stays > 0 in both themes (crossing 0 would recompile the shader)
    if (isMobile) g.opacity = n(L.glassMobileOpacity, D.glassMobileOpacity);
    else g.transmission = n(L.glassTransmission, D.glassTransmission);
  }
  bloomPass.strength = n(L.bloomStrength, D.bloomStrength);
  bloomPass.radius = n(L.bloomRadius, D.bloomRadius);
  bloomPass.threshold = n(L.bloomThreshold, D.bloomThreshold);
  if (themed.reflectorMat) {
    themed.reflectorMat.uniforms.uIntensity.value = n(L.reflIntensity, D.reflIntensity);
    themed.reflectorMat.uniforms.uTint.value = n(L.reflTint, D.reflTint);
    themed.reflectorMat.uniforms.uBlur.value = n(L.reflBlur, D.reflBlur);
    const s = n(L.reflScale, D.reflScale);
    themed.reflector.scale.set(s, s, 1);
  }
  if (themed.blobMat) themed.blobMat.color.setScalar(n(L.blobTint, D.blobTint));
  if (themed.groundMat) {
    lerpColor(L.contactColor, D.contactColor, t, themed.groundMat.color);
    themed.groundMat.opacity = n(L.contactOpacity, D.contactOpacity);
  }
  const look = weather.look;
  lerpColor(L.rainColor, D.rainColor, t, look.rainColor);
  lerpColor(L.snowColor, D.snowColor, t, look.snowColor);
  look.rainOpacity = n(L.rainOpacity, D.rainOpacity);
  look.rippleOpacity = n(L.rippleOpacity, D.rippleOpacity);
  look.snowOpacity = n(L.snowOpacity, D.snowOpacity);
}

// --- Weather effects: rain, snow -------------------------------------------------
// All generated in code (no image or model files). Each effect has a strength
// (0..1) that eases toward its target, so switching crossfades; at 0 its
// objects are hidden and cost nothing. They're built once the model has
// loaded, because they size themselves to it. Rules from earlier bugs:
// particles live on AO_EXCLUDED_LAYER (GTAO's G-buffer pass would draw them
// as solid shapes), and the custom shaders avoid anything that can produce
// NaN (no pow(), ascending smoothstep edges only, depth clamped before
// dividing).
const WEATHER_TYPES = ['rain', 'snow'];
const WEATHER_SPEED = (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) ? 0.3 : 1;
const weather = {
  built: false,
  current: 'none',
  strength: { rain: 0, snow: 0 },
  target: { rain: 0, snow: 0 },
  look: { rainColor: new THREE.Color(), rainOpacity: 0, rippleOpacity: 0, snowColor: new THREE.Color(), snowOpacity: 0 },
  time: 0,
  lastT: 0,
  rain: null, ripples: null, topRipples: null, snow: null,
};

const RAIN_VERT = `
  uniform float uTime; uniform float uHeight; uniform float uBottom;
  uniform float uLength; uniform float uSpeed; uniform float uSlant;
  attribute vec4 aSeed; attribute float aEnd;
  varying float vHead;
  void main() {
    float fall = mod( aSeed.y * uHeight + uTime * uSpeed * aSeed.w, uHeight );
    vec3 p = vec3( aSeed.x + uSlant * fall, uBottom + uHeight - fall, aSeed.z );
    p += vec3( -uSlant, 1.0, 0.0 ) * ( aEnd * uLength ); // tail trails up and back
    vHead = 1.0 - aEnd;
    gl_Position = projectionMatrix * modelViewMatrix * vec4( p, 1.0 );
  }`;
const RAIN_FRAG = `
  uniform vec3 uColor; uniform float uOpacity;
  varying float vHead;
  void main() { gl_FragColor = vec4( uColor, uOpacity * vHead ); }`;

// Raindrop ripples. One quad per ripple; the rings are drawn in the fragment
// shader. Each landing: a brief bright splash point, then a thin leading ring
// that races out and slows down, with two fainter rings trailing inside it,
// all softening and fading as they spread (like a drop on a puddle).
// SPOTS: instead of anywhere on the floor, land on precomputed points on the
// tops of the letters (uSpots, found by raycasting at load).
const RIPPLE_VERT = `
  uniform float uTime; uniform float uRate; uniform float uArea; uniform float uSize; uniform float uFloorY;
  #ifdef SPOTS
  uniform vec3 uSpots[ SPOT_COUNT ];
  #endif
  attribute vec2 aRipple; // x: seed, y: phase offset
  varying vec2 vUv; varying float vPhase;
  float hash( float n ) { return fract( sin( n ) * 43758.5453 ); }
  void main() {
    float cyc = uTime * uRate + aRipple.y;
    float phase = fract( cyc );
    float k = floor( cyc ); // each new ripple lands somewhere new
    #ifdef SPOTS
    int idx = int( min( floor( hash( aRipple.x + k * 1.7 ) * float( SPOT_COUNT ) ), float( SPOT_COUNT - 1 ) ) );
    vec3 c = uSpots[ idx ];
    #else
    vec2 xz = ( vec2( hash( aRipple.x + k * 1.7 ), hash( aRipple.x * 1.3 + k * 2.9 ) ) * 2.0 - 1.0 ) * uArea;
    vec3 c = vec3( xz.x, uFloorY, xz.y );
    #endif
    float s = uSize * ( 0.65 + 0.5 * hash( aRipple.x * 0.7 + k * 3.1 ) ); // drops vary in size
    vec3 p = c + vec3( position.x * s, 0.0, position.z * s );
    vUv = uv; vPhase = phase;
    gl_Position = projectionMatrix * modelViewMatrix * vec4( p, 1.0 );
  }`;
const RIPPLE_FRAG = `
  uniform vec3 uColor; uniform float uOpacity;
  varying vec2 vUv; varying float vPhase;
  float ring( float d, float r, float w ) { float x = ( d - r ) / w; return exp( -x * x ); }
  void main() {
    float d = length( vUv - 0.5 ) * 2.0;
    float p = vPhase;
    float r = p * ( 2.0 - p );        // fast at first, then slowing
    float w = 0.02 + 0.05 * p;        // rings get softer as they spread
    float a = ring( d, r, w )
            + 0.35 * ring( d, r * 0.66, w * 0.9 ) * smoothstep( 0.08, 0.22, p )
            + 0.15 * ring( d, r * 0.38, w * 0.8 ) * smoothstep( 0.2, 0.36, p );
    float fade = ( 1.0 - p ) * ( 1.0 - p );
    float splash = exp( -d * d * 160.0 ) * ( 1.0 - smoothstep( 0.0, 0.16, p ) );
    float edge = 1.0 - smoothstep( 0.86, 1.0, d ); // never reach the quad's edge
    gl_FragColor = vec4( uColor, ( a * fade * edge + splash * 0.8 ) * uOpacity );
  }`;

const SNOW_VERT = `
  uniform float uTime; uniform float uHeight; uniform float uBottom;
  uniform float uSpeed; uniform float uSway; uniform float uSize; uniform float uScale;
  attribute vec4 aSeed; attribute vec2 aSway;
  varying float vFade;
  void main() {
    float fall = mod( aSeed.y * uHeight + uTime * uSpeed * aSway.y, uHeight );
    vec3 p = vec3(
      aSeed.x + sin( uTime * 0.8 * aSway.y + aSway.x ) * uSway,
      uBottom + uHeight - fall,
      aSeed.z + cos( uTime * 0.6 * aSway.y + aSway.x * 1.7 ) * uSway * 0.7 );
    vec4 mv = modelViewMatrix * vec4( p, 1.0 );
    gl_Position = projectionMatrix * mv;
    gl_PointSize = clamp( uSize * aSeed.w * uScale / max( -mv.z, 0.05 ), 1.0, 20.0 );
    float f = fall / uHeight;
    vFade = smoothstep( 0.0, 0.08, f ) * ( 1.0 - smoothstep( 0.9, 1.0, f ) );
  }`;
const SNOW_FRAG = `
  uniform vec3 uColor; uniform float uOpacity;
  varying float vFade;
  void main() {
    float d = length( gl_PointCoord - 0.5 );
    float a = 1.0 - smoothstep( 0.12, 0.5, d );
    gl_FragColor = vec4( uColor, a * vFade * uOpacity );
  }`;

function weatherObject(obj) {
  obj.frustumCulled = false; // positions are computed in the shader
  obj.layers.set(AO_EXCLUDED_LAYER);
  scene.add(obj);
  return obj;
}

// Finds points on the flat, upward-facing tops of the letters where a small
// ripple fits: samples random up-facing triangles (weighted by area), keeps a
// point only if nothing sits above it and the surface stays flat for the
// ripple's whole width. Only the letter pieces themselves (P_*, X_*, L_*)
// count — props and the decorative accent curves are skipped.
const RIPPLE_TOP_SPOTS = 64;
function findLetterTopSpots(model, maxDim, wanted) {
  model.updateMatrixWorld(true);
  const floaterNames = new Set(FLOATERS.flatMap((f) => f.names));
  const isFloater = (o) => { for (; o; o = o.parent) if (floaterNames.has(o.name)) return true; return false; };
  const meshes = [];
  const isLetter = (o) => { for (; o; o = o.parent) if (/^[PXL]_/.test(o.name)) return true; return false; };
  model.traverse((o) => { if (o.isMesh && !isFloater(o)) meshes.push(o); });
  const letterMeshes = meshes.filter(isLetter);

  // Up-facing triangles, in world space.
  const tris = []; let total = 0;
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), nrm = new THREE.Vector3();
  for (const m of letterMeshes) {
    const pos = m.geometry.getAttribute('position'), idx = m.geometry.index;
    const n = idx ? idx.count : pos.count;
    for (let i = 0; i < n; i += 3) {
      const i0 = idx ? idx.getX(i) : i, i1 = idx ? idx.getX(i + 1) : i + 1, i2 = idx ? idx.getX(i + 2) : i + 2;
      a.fromBufferAttribute(pos, i0).applyMatrix4(m.matrixWorld);
      b.fromBufferAttribute(pos, i1).applyMatrix4(m.matrixWorld);
      c.fromBufferAttribute(pos, i2).applyMatrix4(m.matrixWorld);
      nrm.subVectors(c, b).cross(a.clone().sub(b));
      const len = nrm.length();
      if (len < 1e-12 || nrm.y / len < 0.97) continue;
      total += len * 0.5;
      tris.push({ a: a.clone(), b: b.clone(), c: c.clone(), cum: total });
    }
  }
  if (!tris.length) return [];

  const ray = new THREE.Raycaster();
  const down = new THREE.Vector3(0, -1, 0);
  const top = new THREE.Box3().setFromObject(model).max.y + maxDim;
  const half = maxDim * 0.03 * 0.6; // ripple radius incl. size variation
  const flatTol = maxDim * 0.004;
  const hitAt = (x, z) => {
    ray.set(new THREE.Vector3(x, top, z), down);
    const h = ray.intersectObjects(meshes, false)[0];
    if (!h || !h.face) return null;
    const ny = h.face.normal.clone().transformDirection(h.object.matrixWorld).y;
    return ny > 0.97 && isLetter(h.object) ? h.point : null;
  };
  const spots = [];
  for (let tries = 0; tries < wanted * 12 && spots.length < wanted; tries++) {
    const r = Math.random() * total;
    let lo = 0, hi = tris.length - 1;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (tris[mid].cum < r) lo = mid + 1; else hi = mid; }
    const t = tris[lo];
    let u = Math.random(), v = Math.random();
    if (u + v > 1) { u = 1 - u; v = 1 - v; }
    const p = t.a.clone().addScaledVector(t.b.clone().sub(t.a), u).addScaledVector(t.c.clone().sub(t.a), v);
    const hit = hitAt(p.x, p.z);
    if (!hit || Math.abs(hit.y - p.y) > flatTol) continue; // something sits above it
    let flat = true;
    for (const [dx, dz] of [[half, 0], [-half, 0], [0, half], [0, -half]]) {
      const q = hitAt(p.x + dx, p.z + dz);
      if (!q || Math.abs(q.y - p.y) > flatTol) { flat = false; break; }
    }
    if (flat) spots.push(new THREE.Vector3(p.x, p.y + maxDim * 0.0015, p.z));
  }
  return spots;
}

function buildWeather({ groundY, maxDim, model }) {
  const span = maxDim * 2.4;   // half-width of the volume the particles fill
  const height = maxDim * 2.2;
  const rnd = () => Math.random() * 2 - 1;

  // Rain: thin streaks, animated entirely on the GPU.
  {
    const count = isMobile ? 900 : 1400;
    const slant = 0.12;
    const seeds = new Float32Array(count * 8);
    const ends = new Float32Array(count * 2);
    for (let i = 0; i < count; i++) {
      const s = [rnd() * span - slant * height * 0.5, Math.random(), rnd() * span, 0.85 + Math.random() * 0.3];
      seeds.set(s, i * 8); seeds.set(s, i * 8 + 4);
      ends[i * 2 + 1] = 1;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(count * 6), 3));
    geo.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 4));
    geo.setAttribute('aEnd', new THREE.BufferAttribute(ends, 1));
    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 }, uHeight: { value: height }, uBottom: { value: groundY },
        uLength: { value: maxDim * 0.075 }, uSpeed: { value: maxDim * 2.6 }, uSlant: { value: slant },
        uColor: { value: new THREE.Color() }, uOpacity: { value: 0 },
      },
      vertexShader: RAIN_VERT, fragmentShader: RAIN_FRAG,
      transparent: true, depthWrite: false,
    });
    weather.rain = weatherObject(new THREE.LineSegments(geo, mat));
  }

  // Rain ripples: on the floor, and on the flat tops of the letters.
  const makeRipples = (count, uniforms, defines) => {
    const base = new THREE.PlaneGeometry(1, 1);
    base.rotateX(-Math.PI / 2);
    const geo = new THREE.InstancedBufferGeometry();
    geo.index = base.index;
    geo.setAttribute('position', base.getAttribute('position'));
    geo.setAttribute('uv', base.getAttribute('uv'));
    const data = new Float32Array(count * 2);
    for (let i = 0; i < count; i++) { data[i * 2] = Math.random() * 100; data[i * 2 + 1] = Math.random(); }
    geo.setAttribute('aRipple', new THREE.InstancedBufferAttribute(data, 2));
    geo.instanceCount = count;
    const mat = new THREE.ShaderMaterial({
      uniforms: Object.assign({
        uTime: { value: 0 }, uRate: { value: 1.1 }, uArea: { value: 0 }, uFloorY: { value: 0 },
        uColor: { value: new THREE.Color() }, uOpacity: { value: 0 },
      }, uniforms),
      defines: defines || {},
      vertexShader: RIPPLE_VERT, fragmentShader: RIPPLE_FRAG,
      transparent: true, depthWrite: false,
    });
    return weatherObject(new THREE.Mesh(geo, mat));
  };
  weather.ripples = makeRipples(isMobile ? 16 : 40, {
    uArea: { value: maxDim * 1.3 }, uSize: { value: maxDim * 0.05 }, uFloorY: { value: groundY + 0.002 },
  });
  const spots = findLetterTopSpots(model, maxDim, RIPPLE_TOP_SPOTS);
  if (spots.length) {
    while (spots.length < RIPPLE_TOP_SPOTS) spots.push(spots[spots.length % Math.max(1, spots.length)].clone());
    weather.topRipples = makeRipples(isMobile ? 8 : 18, {
      uSize: { value: maxDim * 0.03 }, uSpots: { value: spots },
    }, { SPOTS: '', SPOT_COUNT: RIPPLE_TOP_SPOTS });
    weather.topRipples.renderOrder = 2; // after the glass, so drops show on it
  }

  // Snow: soft round flakes drifting down with a gentle sway.
  {
    const count = isMobile ? 350 : 900;
    const seeds = new Float32Array(count * 4);
    const sway = new Float32Array(count * 2);
    for (let i = 0; i < count; i++) {
      seeds.set([rnd() * span, Math.random(), rnd() * span, 0.6 + Math.random() * 0.7], i * 4);
      sway.set([Math.random() * Math.PI * 2, 0.7 + Math.random() * 0.6], i * 2);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(count * 3), 3));
    geo.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 4));
    geo.setAttribute('aSway', new THREE.BufferAttribute(sway, 2));
    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 }, uHeight: { value: height }, uBottom: { value: groundY },
        uSpeed: { value: maxDim * 0.32 }, uSway: { value: maxDim * 0.045 },
        uSize: { value: maxDim * 0.009 }, uScale: { value: 1 },
        uColor: { value: new THREE.Color() }, uOpacity: { value: 0 },
      },
      vertexShader: SNOW_VERT, fragmentShader: SNOW_FRAG,
      transparent: true, depthWrite: false,
    });
    weather.snow = weatherObject(new THREE.Points(geo, mat));
  }

  weather.built = true;
  for (const w of WEATHER_TYPES) weather.strength[w] = weather.target[w]; // start in the chosen state, no fade on load
  applyWeatherFrame(0);
}

const _bufSize = new THREE.Vector2();
function applyWeatherFrame() {
  if (!weather.built) return;
  const st = weather.strength, look = weather.look, time = weather.time;

  const rainOn = st.rain > 0.001;
  weather.rain.visible = weather.ripples.visible = rainOn;
  if (weather.topRipples) weather.topRipples.visible = rainOn;
  if (rainOn) {
    const u = weather.rain.material.uniforms;
    u.uTime.value = time;
    u.uColor.value.copy(look.rainColor);
    u.uOpacity.value = look.rainOpacity * st.rain;
    for (const rp of [weather.ripples, weather.topRipples]) {
      if (!rp) continue;
      const r = rp.material.uniforms;
      r.uTime.value = time;
      r.uColor.value.copy(look.rainColor);
      r.uOpacity.value = look.rippleOpacity * st.rain;
    }
  }

  const snowOn = st.snow > 0.001;
  weather.snow.visible = snowOn;
  if (snowOn) {
    const u = weather.snow.material.uniforms;
    u.uTime.value = time;
    u.uColor.value.copy(look.snowColor);
    u.uOpacity.value = look.snowOpacity * st.snow;
    renderer.getDrawingBufferSize(_bufSize);
    u.uScale.value = (_bufSize.y * 0.5) / Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5));
  }
}

function updateWeather() {
  const now = performance.now() / 1000;
  const dt = weather.lastT ? Math.min(0.1, now - weather.lastT) : 0;
  weather.lastT = now;
  weather.time += dt * WEATHER_SPEED;
  const k = Math.min(1, dt * 4.5); // ~0.7s crossfade
  for (const w of WEATHER_TYPES) {
    let s = weather.strength[w] + (weather.target[w] - weather.strength[w]) * k;
    if (Math.abs(s - weather.target[w]) < 0.002) s = weather.target[w];
    weather.strength[w] = s;
  }
  applyWeatherFrame(dt);
}

const weatherBtns = Array.from(document.querySelectorAll('.weather-btn'));
function setWeather(name, persist) {
  weather.current = WEATHER_TYPES.includes(name) ? name : 'none';
  for (const b of weatherBtns) b.setAttribute('aria-pressed', String(b.dataset.weather === weather.current));
  for (const w of WEATHER_TYPES) weather.target[w] = w === weather.current ? 1 : 0;
  if (persist) { try { localStorage.setItem('pxl-viewer-weather', weather.current); } catch (e) {} }
}
weatherBtns.forEach((b) => b.addEventListener('click', () => {
  setWeather(weather.current === b.dataset.weather ? 'none' : b.dataset.weather, true);
}));
// Starting weather: the visitor's own saved choice, then ?weather=rain|snow
// in the URL (handy for demos and embeds), then none.
(function () {
  let w = 'none';
  try {
    const q = new URLSearchParams(location.search).get('weather');
    if (WEATHER_TYPES.includes(q)) w = q;
    const saved = localStorage.getItem('pxl-viewer-weather');
    if (saved === 'none' || WEATHER_TYPES.includes(saved)) w = saved;
  } catch (e) {}
  setWeather(w, false);
})();

const themeToggleEl = document.getElementById('theme-toggle');
const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
let themeTweenRAF = null;
function setTheme(name, animate) {
  const dark = name === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  themeToggleEl.setAttribute('aria-pressed', String(dark));
  themeToggleEl.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
  if (themeTweenRAF) cancelAnimationFrame(themeTweenRAF);
  themeTweenRAF = null;
  const target = dark ? 1 : 0;
  if (!animate || reduceMotion) { applyThemeMix(target); return; }
  const from = themeMix, start = performance.now(), duration = 650;
  const step = (now) => {
    const k = Math.min(1, (now - start) / duration);
    const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; // ease in-out
    applyThemeMix(from + (target - from) * e);
    themeTweenRAF = k < 1 ? requestAnimationFrame(step) : null;
  };
  themeTweenRAF = requestAnimationFrame(step);
}
themeToggleEl.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  setTheme(next, true);
  try { localStorage.setItem('pxl-viewer-theme', next); } catch (e) {}
});
setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light', false);

const loader = new GLTFLoader();
loader.load('pxl_logo.glb', (gltf) => {
  const model = gltf.scene;

  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  model.position.sub(center);
  const modelScale = Math.max(size.x, size.y, size.z);

  model.traverse((obj) => {
    if (obj.isMesh) {
      obj.castShadow = true;
      obj.receiveShadow = true;

      if (PLAIN_WHITE_MESHES.has(obj.name)) {
        // This mesh has no material in the GLB, so three.js gives it the glTF
        // default (metalness 1), which mirrors the environment and turns
        // grey once roughness drops. Plain non-metal white instead.
        obj.material = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0, roughness: 0.6, envMapIntensity: 0.6 });
        return;
      }

      // Upgrade to MeshPhysicalMaterial with a glossy clearcoat, like painted plastic/toy shells.
      if (obj.material && obj.material.isMeshStandardMaterial) {
        const old = obj.material;
        const isGlass = GLASS_MATERIALS.has(old.name);
        const physical = new THREE.MeshPhysicalMaterial({
          color: old.color,
          map: old.map || null,
          roughness: Math.min(old.roughness, GLOSS.maxRoughness),
          metalness: old.metalness,
          clearcoat: GLOSS.clearcoat,
          clearcoatRoughness: GLOSS.clearcoatRoughness,
          envMapIntensity: 0.6,
          // Soft warm rim/fresnel glow at grazing angles — reads as a gentle
          // edge-highlight on the glossy toy-plastic shapes as they rotate.
          sheen: 0.45,
          sheenColor: new THREE.Color(0xff9fd6),
          sheenRoughness: 0.35,
        });
        if (isGlass) {
          physical.roughness = GLASS.roughness;
          physical.emissive.set(0xffffff); // strength set per theme (glassGlow)
          physical.emissiveIntensity = 0;
          glassMats.push(physical);
          physical.sheen = 0; // sheen would fog the glass
          obj.castShadow = false; // glass shouldn't throw a solid shadow
          if (isMobile) {
            // Real transmission costs an extra scene render per frame (and
            // per reflector render); phones get plain alpha blending, which
            // reads similarly at phone size and stays inside the memory budget.
            physical.transparent = true;
            physical.opacity = GLASS.mobileOpacity;
          } else {
            physical.transmission = GLASS.transmission;
            physical.thickness = GLASS.thickness * modelScale;
            physical.ior = GLASS.ior;
            physical.attenuationColor.set(GLASS.attenuationColor);
            physical.attenuationDistance = GLASS.attenuationDistance * modelScale;
          }
        }
        obj.material = physical;
        physicalMats.push(physical);

        // True fresnel rim-light shader: an additive glow along silhouette
        // edges, independent of the base sheen above. Injected via
        // onBeforeCompile so it layers on top of the existing PBR shading
        // rather than replacing it. Tunable via RIM_* constants below.
        // The clamp() in the fresnel term below is load-bearing: on real GPUs
        // dot() of two unit vectors can round to slightly above 1.0 where a
        // surface faces the camera head-on, and pow() of the resulting tiny
        // negative number returns NaN. UnrealBloomPass's blur then smears
        // those NaN pixels into large black rectangles — that was the
        // intermittent black-flicker bug. Measured on an Apple M2: the
        // unclamped version produced NaN on ~30% of near-head-on pixels,
        // the clamped version on 0%.
        physical.onBeforeCompile = (shader) => {
          shader.uniforms.rimColor = { value: new THREE.Color(RIM_COLOR) };
          shader.uniforms.rimPower = { value: RIM_POWER };
          shader.uniforms.rimIntensity = { value: RIM_INTENSITY };
          shader.vertexShader = shader.vertexShader
            .replace(
              '#include <common>',
              `#include <common>\nvarying vec3 vRimNormal;\nvarying vec3 vRimView;`
            )
            .replace(
              '#include <begin_vertex>',
              `#include <begin_vertex>\nvRimNormal = normalize( normalMatrix * normal );\nvRimView = normalize( -( modelViewMatrix * vec4( position, 1.0 ) ).xyz );`
            );
          shader.fragmentShader = shader.fragmentShader
            .replace(
              '#include <common>',
              `#include <common>\nuniform vec3 rimColor;\nuniform float rimPower;\nuniform float rimIntensity;\nvarying vec3 vRimNormal;\nvarying vec3 vRimView;`
            )
            .replace(
              '#include <dithering_fragment>',
              `float rimFresnel = pow( clamp( 1.0 - dot( normalize( vRimNormal ), normalize( vRimView ) ), 0.0, 1.0 ), rimPower );\ngl_FragColor.rgb += rimColor * rimFresnel * rimIntensity;\n#include <dithering_fragment>`
            );
        };
        physical.needsUpdate = true;
      }
    }
  });

  scene.add(model);

  // Set up the idle floaters now that the model's real scale is known.
  const floatScale = Math.max(size.x, size.y, size.z);
  FLOATERS.forEach((cfg) => {
    cfg.names.forEach((name) => {
      const obj = model.getObjectByName(name);
      if (!obj) return;
      floaters.push({
        obj,
        baseY: obj.position.y,
        baseRotZ: obj.rotation.z,
        ampY: cfg.ampY * floatScale,
        ampRot: cfg.ampRot,
        speed: cfg.speed,
        phase: cfg.phase,
      });
    });
  });

  const groundY = box.min.y - center.y;

  // Big, soft blob shadow: a genuinely blurred radial gradient (canvas filter,
  // not just gradient stops), like stylized product-render shadows, layered
  // underneath a light real-time contact shadow for grounding detail.
  function makeBlobShadowTexture() {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    ctx.filter = 'blur(30px)';
    const grad = ctx.createRadialGradient(256, 256, 0, 256, 256, 170);
    grad.addColorStop(0, 'rgba(122,52,78,0.24)');
    grad.addColorStop(0.55, 'rgba(122,52,78,0.1)');
    grad.addColorStop(1, 'rgba(122,52,78,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 512, 512);
    const tex = new THREE.CanvasTexture(c);
    return tex;
  }
  // Subtle reflective floor: a small mirror plane hugging just the model's
  // footprint. Stock three.js Reflector hardcodes its shader output to full
  // opacity (gl_FragColor.a = 1.0) and blends with an Overlay mode that reads
  // as too bright/legible against a colorful backdrop — so its shader is
  // patched below to add a real radial alpha falloff (fades all the way to
  // fully transparent well before the plane's geometric edge, which is what
  // actually removes the visible "box" — you're seeing the true background
  // through it, not an approximation) and a simple darken-mix blend instead
  // of Overlay, toned down to a faint gleam rather than a legible mirror.
  const reflectorSize = Math.max(size.x, size.z) * 1.7;
  const reflectorGeo = new THREE.PlaneGeometry(reflectorSize, reflectorSize);
  const groundReflector = new Reflector(reflectorGeo, {
    color: 0x1a1418,
    textureWidth: isMobile ? 256 : 512,
    textureHeight: isMobile ? 256 : 512,
    clipBias: 0.0003,
  });
  groundReflector.rotation.x = -Math.PI / 2;
  groundReflector.position.y = groundY - 0.003;

  const reflMat = groundReflector.material;
  reflMat.transparent = true;
  reflMat.uniforms.uRadius = { value: reflectorSize / 2 };
  reflMat.uniforms.uIntensity = { value: 0.18 };
  reflMat.uniforms.uTint = { value: 0.5 }; // how much the mirror image is darkened toward `color` (theme-driven)
  reflMat.uniforms.uBlur = { value: 0 }; // glossy blur radius in UV units (0 = sharp, the original light look)
  reflMat.vertexShader = `
    uniform mat4 textureMatrix;
    varying vec4 vUv;
    varying vec2 vPos;
    #include <common>
    #include <logdepthbuf_pars_vertex>
    void main() {
      vUv = textureMatrix * vec4( position, 1.0 );
      vPos = position.xy;
      gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
      #include <logdepthbuf_vertex>
    }
  `;
  reflMat.fragmentShader = `
    uniform vec3 color;
    uniform sampler2D tDiffuse;
    uniform float uRadius;
    uniform float uIntensity;
    uniform float uTint;
    uniform float uBlur;
    varying vec4 vUv;
    varying vec2 vPos;
    #include <logdepthbuf_pars_fragment>
    void main() {
      #include <logdepthbuf_fragment>
      // 9-tap glossy blur, stretched vertically for a wet-floor streak.
      // With uBlur = 0 every tap is the same texel: identical to the
      // original sharp lookup.
      vec2 ruv = vUv.xy / vUv.w;
      vec2 o = vec2( uBlur, uBlur * 2.5 );
      vec4 base = texture2D( tDiffuse, ruv ) * 0.2;
      base += ( texture2D( tDiffuse, ruv + vec2( o.x, 0.0 ) ) + texture2D( tDiffuse, ruv - vec2( o.x, 0.0 ) )
              + texture2D( tDiffuse, ruv + vec2( 0.0, o.y ) ) + texture2D( tDiffuse, ruv - vec2( 0.0, o.y ) ) ) * 0.1;
      base += ( texture2D( tDiffuse, ruv + o ) + texture2D( tDiffuse, ruv - o )
              + texture2D( tDiffuse, ruv + vec2( o.x, -o.y ) ) + texture2D( tDiffuse, ruv + vec2( -o.x, o.y ) ) ) * 0.1;
      vec3 blended = mix( base.rgb, color, uTint );
      float dist = length( vPos ) / uRadius;
      float edgeFade = 1.0 - smoothstep( 0.25, 1.0, dist );
      gl_FragColor = vec4( blended, edgeFade * uIntensity );
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `;
  reflMat.needsUpdate = true;

  // Reflector's onBeforeRender does its own nested full-scene render (to
  // update its mirror texture) every time it's drawn. That nested render
  // conflicts with any pass that renders the scene through a temporary
  // scene.overrideMaterial (e.g. GTAOPass's normal/depth G-buffer pre-pass)
  // — the two renders' internal state stomp on each other and were
  // corrupting a large rectangular region of the frame to solid black.
  // Skip the reflection's self-render whenever an override material is
  // active; it only needs to update for the real color pass.
  const reflectorOnBeforeRender = groundReflector.onBeforeRender;
  groundReflector.onBeforeRender = function (rendererArg, sceneArg, cameraArg, ...rest) {
    if (sceneArg.overrideMaterial) return;
    reflectorOnBeforeRender.call(this, rendererArg, sceneArg, cameraArg, ...rest);
  };

  // Flat ground-level helpers (reflector, blob shadow, shadow-catcher) are
  // put on AO_EXCLUDED_LAYER, kept out of GTAOPass's dedicated camera (see
  // below) but still visible to the main camera. These are thin decorative
  // planes, not real occluding geometry — worse, GTAOPass's G-buffer pass
  // renders the whole scene through a temporary opaque override material,
  // which ignores each object's actual transparency. Left in, the
  // reflector's own faded, near-invisible floor renders as a big *fully
  // opaque* flat quad for that one internal pass, large enough (viewed from
  // this steep an angle) to fill a huge rectangle of "occluded" black across
  // most of the frame once blended back in.
  groundReflector.layers.set(AO_EXCLUDED_LAYER);
  scene.add(groundReflector);
  themed.reflector = groundReflector;
  themed.reflectorMat = reflMat;

  // Give the blob shadow directionality, so it reads as falling away
  // from the key light's fixed position instead of a perfectly symmetric
  // halo (which carries no information about where the light is).
  //
  // Horizontal projection of the direction the key light travels in
  // (light -> origin, continued past the model) — the ground-plane
  // direction the shadow should trail off toward, since the light itself
  // never moves. Computed once from the light's fixed position.
  const lightDirX = -key.position.x;
  const lightDirZ = -key.position.z;
  const lightDirLen = Math.hypot(lightDirX, lightDirZ);
  const shadowDirX = lightDirX / lightDirLen;
  const shadowDirZ = lightDirZ / lightDirLen;
  const shadowAzimuth = Math.atan2(shadowDirX, shadowDirZ);

  const BLOB_STRETCH = 1.55; // elongate the blob along the shadow direction
  const BLOB_OFFSET = Math.max(size.x, size.z) * 0.34; // shift it off-center, away from the light

  const blobSize = Math.max(size.x, size.z) * 3.8;
  const blobGeo = new THREE.PlaneGeometry(blobSize, blobSize);
  blobGeo.scale(1, BLOB_STRETCH, 1);
  const blobMat = new THREE.MeshBasicMaterial({
    map: makeBlobShadowTexture(),
    transparent: true,
    depthWrite: false,
    toneMapped: false,
  });
  const blob = new THREE.Mesh(blobGeo, blobMat);
  blob.rotation.x = -Math.PI / 2;
  blob.position.z = BLOB_OFFSET;
  blob.layers.set(AO_EXCLUDED_LAYER);

  const blobPivot = new THREE.Group();
  blobPivot.position.y = groundY + 0.001;
  blobPivot.rotation.y = shadowAzimuth;
  blobPivot.add(blob);
  scene.add(blobPivot);
  themed.blobMat = blobMat;

  const groundGeo = new THREE.PlaneGeometry(50, 50);
  const groundMat = new THREE.ShadowMaterial({ color: 0x4a2436, opacity: 0.09 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = groundY;
  ground.receiveShadow = true;
  ground.layers.set(AO_EXCLUDED_LAYER);
  scene.add(ground);
  themed.groundMat = groundMat;

  const maxDim = Math.max(size.x, size.y, size.z);
  const dist = maxDim * 3.3;
  camera.position.set(0, size.y * 0.35, dist);
  controls.target.set(0, 0, 0);
  controls.update();

  // Lock the vertical drag range to roughly this framing: a little more room
  // to look down on the piece from above, but only a small buffer below the
  // starting angle so dragging can't dip under the model to see its underside.
  const camVec = camera.position.clone().sub(controls.target);
  const initialPolar = Math.acos(THREE.MathUtils.clamp(camVec.y / camVec.length(), -1, 1));
  controls.minPolarAngle = Math.max(THREE.MathUtils.degToRad(20), initialPolar - THREE.MathUtils.degToRad(35));
  controls.maxPolarAngle = Math.min(THREE.MathUtils.degToRad(92), initialPolar + THREE.MathUtils.degToRad(8));

  buildWeather({ groundY, maxDim, model });

  // Warm up every shader program (physical material + custom rim-light
  // injection, the reflector, bloom, shadow-depth variants) with a hidden
  // render pass now, while the loading overlay still fully covers the
  // canvas. Without this, the very first visible frame after the overlay
  // fades can stutter/flash while the GPU compiles ~140 unique material
  // programs for the first time — this pushes that cost behind the loader
  // instead of onto the reveal.
  // Bring the newly created objects in line with the current theme before
  // the shader warm-up below.
  applyThemeMix(themeMix);
  // Weather objects are made visible for the warm-up so their shaders
  // compile now, not on the first click; applyWeatherFrame restores them.
  [weather.rain, weather.ripples, weather.topRipples, weather.snow].forEach((o) => { if (o) o.visible = true; });
  renderer.compile(scene, camera);
  composer.render();
  applyWeatherFrame(0);

  whenLoaderMinTimeElapsed(() => {
    // Same idea as the shader warm-up above: don't reveal until we know the
    // canvas is actually sized correctly. If this page is inside an iframe
    // that's still mid-transition (a popup opening, or an Artifact panel
    // being mounted/resized), window.innerWidth/innerHeight can be 0 or
    // still changing frame to frame right up until that transition
    // settles — reacting to a resize AFTER a bad frame already rendered
    // still means a visible flash. Waiting here for two consecutive
    // matching, non-zero readings means the reveal only ever happens once
    // sizing has actually settled.
    syncSize();
    waitForStableSize(() => {
      finishProgress();
      setTimeout(() => { loadingEl.classList.add('hide'); }, 350);
    });
  });
}, (xhr) => {
  if (xhr.lengthComputable) {
    setProgress((xhr.loaded / xhr.total) * 100);
  }
}, (err) => {
  console.error('LOAD_ERROR', err.message || String(err));
  stopProgress();
  const markEl = loadingEl.querySelector('.mark');
  markEl.textContent = 'Could not load model';
  markEl.classList.add('show-error');
});

// Temporary diagnostics (safe to leave in — console-only, no visible
// effect) while tracking down the intermittent black-frame bug: logs
// whenever a frame takes unusually long to arrive (a stalled/throttled rAF
// loop, our leading theory) and whenever a render pass itself throws (a
// different, GL-state-level cause). Open the browser console and reproduce
// the glitch — whichever of these fires right around the moment it happens
// tells us which mechanism is actually responsible.
let lastFrameTime = performance.now();
const FRAME_GAP_WARN_MS = 400;

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const gap = now - lastFrameTime;
  if (gap > FRAME_GAP_WARN_MS) {
    console.warn('[PXL viewer] FRAME_GAP', Math.round(gap) + 'ms since last frame', new Date().toISOString());
  }
  lastFrameTime = now;

  const t = clock.getElapsedTime();
  for (let i = 0; i < floaters.length; i++) {
    const f = floaters[i];
    f.obj.position.y = f.baseY + Math.sin(t * f.speed + f.phase) * f.ampY;
    f.obj.rotation.z = f.baseRotZ + Math.sin(t * f.speed * 0.8 + f.phase) * f.ampRot;
  }
  updateWeather();
  controls.update();

  // Keep the AO-only camera locked to the real one every frame (position,
  // orientation, and projection all change as the user drags/zooms).
  aoCamera.position.copy(camera.position);
  aoCamera.quaternion.copy(camera.quaternion);
  aoCamera.fov = camera.fov;
  aoCamera.aspect = camera.aspect;
  aoCamera.near = camera.near;
  aoCamera.far = camera.far;
  aoCamera.updateProjectionMatrix();

  try {
    composer.render();
  } catch (err) {
    console.error('[PXL viewer] RENDER_ERROR', err && (err.message || String(err)), new Date().toISOString());
  }
}
animate();

// Draws one real frame right now, outside the normal requestAnimationFrame
// loop below. Browsers throttle or fully pause rAF callbacks for a window
// that's occluded, not frontmost, or otherwise deprioritized by the OS
// compositor — animate() simply stops being called while that's true,
// freezing the canvas on whatever frame it last drew. If that freeze lands
// mid-transition (e.g. right as the loading overlay is fading out, or mid
// resize), what's frozen on screen can be a black or half-composited frame
// that only clears once the browser resumes delivering rAF callbacks —
// which normally happens the instant the user interacts with the page.
// Every place below that knows focus/visibility/size just changed calls
// this directly instead of waiting on that.
function forceRender(reason) {
  console.warn('[PXL viewer] forceRender()', reason || '(no reason given)', new Date().toISOString());
  controls.update();
  aoCamera.position.copy(camera.position);
  aoCamera.quaternion.copy(camera.quaternion);
  aoCamera.fov = camera.fov;
  aoCamera.aspect = camera.aspect;
  aoCamera.near = camera.near;
  aoCamera.far = camera.far;
  aoCamera.updateProjectionMatrix();
  composer.render();
}

function syncSize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  if (!w || !h) return; // still hidden (e.g. mid popup-open transition) — nothing valid to size to yet
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  forceRender('syncSize');
}
window.addEventListener('resize', syncSize);

// Polls until window.innerWidth/innerHeight are non-zero AND unchanged
// between two checks ~50ms apart, then calls back — used to gate the
// loading overlay's reveal so it never happens mid-transition (see the
// model-load callback above). Never blocks forever: gives up and reveals
// anyway after ~1.5s, in case something legitimately keeps resizing
// (better a flicker in that rare case than a stuck loader).
function waitForStableSize(callback, attempt) {
  attempt = attempt || 0;
  const w = window.innerWidth;
  const h = window.innerHeight;
  const stable = w && h && w === waitForStableSize._lastW && h === waitForStableSize._lastH;
  waitForStableSize._lastW = w;
  waitForStableSize._lastH = h;
  if (stable || attempt > 30) {
    callback();
    return;
  }
  requestAnimationFrame(() => setTimeout(() => waitForStableSize(callback, attempt + 1), 50));
}

// A plain window 'resize' event only fires when the browser window/iframe
// itself changes size. When this page loads inside a popup's iframe that
// starts display:none, the iframe's viewport can jump straight from 0x0 to
// its real size the moment the popup opens — that's a real layout change,
// but not one guaranteed to dispatch a 'resize' event on this window. A
// ResizeObserver catches it directly, since it fires on any actual size
// change of the observed element regardless of what caused it.
if (window.ResizeObserver) {
  const ro = new ResizeObserver(syncSize);
  ro.observe(document.documentElement);
}

// Extra safety net for the same scenario: if sizing was ever captured while
// hidden (0x0, or the initW/initH fallback above) and nothing else happens
// to trigger a layout event afterward, catch up shortly after load and
// whenever the tab/frame becomes visible again.
document.addEventListener('visibilitychange', () => { if (!document.hidden) { syncSize(); forceRender('visibilitychange'); } });
window.addEventListener('pageshow', () => { syncSize(); forceRender('pageshow'); });
// The signal most directly tied to the rAF-throttling scenario above: the
// window regaining OS focus doesn't always also fire 'visibilitychange' or
// 'resize', so it gets its own listener rather than relying on those to
// cover it too.
window.addEventListener('focus', () => { syncSize(); forceRender('focus'); });
setTimeout(syncSize, 150);
setTimeout(syncSize, 600);
setTimeout(() => forceRender('900ms-timeout'), 900);
</script>
</body>
</html>
